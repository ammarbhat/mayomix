name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: aa
          POSTGRES_DB: postgres
        ports:
          - 1313:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Create .env for CI
        run: |
          echo "DATABASE_URL=postgresql://postgres:aa@localhost:1313/postgres" >> .env
          echo "SECRET_KEY=bfdfdd03b53cf6317b37ammaraleem0b4ec6d6df078efa85a3c78c72b9c57db8" >> .env
          echo "ALGORITHM=HS256" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
          echo "ORIGINS=[\"http://localhost:5173\"]" >> .env
          echo "MUSICBRAINZ_USER_AGENT=mayo-mix-ci/0.1" >> .env

      - name: Run migration upgrade
        run: uv run alembic upgrade head

      - name: Run alembic check 
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest

