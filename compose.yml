services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /app

    volumes:
      - ./app:/app/app

    ports:
      - "${APP_PORT:-8000}:8000"

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ORIGINS=${ORIGINS}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - MUSICBRAINZ_USER_AGENT=${MUSICBRAINZ_USER_AGENT}
      - BETTER_STACK_TOKEN=${BETTER_STACK_TOKEN}
      - BETTER_STACK_HOST=${BETTER_STACK_HOST}

  migrations:
    build:
      context: .
      dockerfile: Dockerfile

    working_dir: /app

    command: alembic upgrade head

    environment:
      - DATABASE_URL=${DATABASE_URL}

    restart: "no"