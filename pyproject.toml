[project]
name = "mayomix"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "logtail-python>=0.5.3",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]
[tool.fastapi]
entrypoint = "src.main:app"
[tool.pytest.ini_options]
pythonpath = ["."]
